<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>专注中 · 番茄专注</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main class="card">
    <svg class="tomato" viewBox="0 0 64 64" aria-hidden="true">
      <ellipse cx="32" cy="37" rx="22" ry="20" fill="#e8613c"/>
      <ellipse cx="25" cy="31" rx="6" ry="4" fill="#f2896b" opacity="0.7"/>
      <path d="M32 18c-3-4-8-5-12-3 3 1 5 3 6 5-4 0-7 2-8 5 4-2 8-2 11-1 1 1 2 1 3 1s2 0 3-1c3-1 7-1 11 1-1-3-4-5-8-5 1-2 3-4 6-5-4-2-9-1-12 3z" fill="#5b9a4b"/>
      <rect x="31" y="11" width="2.4" height="8" rx="1.2" fill="#4a7f3c"/>
    </svg>

    <p class="badge" id="badge">专注进行中</p>
    <h1 id="title">回到学习吧</h1>
    <p class="site-line" id="site-line">
      <span id="site" class="site">这个网站</span> 在专注期间被暂时屏蔽了
    </p>
    <p class="quote" id="quote">每一个番茄钟，都在把你推向更好的自己。</p>

    <div class="actions">
      <button type="button" class="btn primary" id="close-btn">关闭此页，继续专注</button>
      <a class="btn ghost hidden" id="back-btn" href="#">返回原网页</a>
    </div>

    <p class="hint" id="hint">本轮专注（包括中间的休息）结束后就可以访问了。</p>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
