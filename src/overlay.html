<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>专注模式</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--gutter);
      user-select: none;
      overflow: hidden;
    }

    .overlay {
      width: 100%;
      max-width: 420px;
    }

    .overlay-time {
      font-family: var(--mono);
      font-size: var(--fs-timer);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    .overlay-time .sep {
      color: var(--ink-faint);
    }

    .overlay-status {
      margin-top: 10px;
      font-family: var(--mono);
      font-size: var(--fs-meta);
      letter-spacing: 0.12em;
      color: var(--ink-soft);
    }

    .overlay-blocked {
      margin-top: var(--gap-entry);
      padding-top: 12px;
      border-top: 1px solid var(--rule);
      color: var(--ink-body);
    }

    .overlay-actions {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: var(--gap-entry);
    }
  </style>
</head>
<body class="state-working">
  <div class="overlay">
    <h1 class="block-label"><span class="cn" id="overlay-title">专注进行中</span><span class="en">Focus</span></h1>
    <div class="overlay-time" aria-live="off"><span id="overlay-minutes">25</span><span class="sep">:</span><span id="overlay-seconds">00</span></div>
    <p class="overlay-status" id="overlay-status"></p>
    <p class="overlay-blocked" id="overlay-message">这个 App 已被暂时拦截。先回到手头的任务，休息时再来看它。</p>
    <div class="overlay-actions" id="overlay-actions">
      <button id="btn-back" class="btn btn--primary" type="button">回到专注</button>
      <button id="btn-emergency" class="link" type="button">紧急取消</button>
    </div>
  </div>
  <script type="module" src="js/overlay.js"></script>
</body>
</html>
